name: Enterprise-Intelligent-Knowledge-Engine

networks:
  # Private: apps talk to each other. No host port publish.
  # Not internal:true — worker still needs outbound HTTPS (Gemini, LlamaParse).
  eike_network:
    driver: bridge
  # Public: only the gateway is attached. Host reaches :3000 here.
  public_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: eike_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eike_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  redis_cache:
    image: redis:7.0-alpine
    container_name: eike_redis_cache
    volumes:
      - redis_data:/data
    networks:
      - eike_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: eike_ai_worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres_db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
      SHARED_UPLOAD: /shared/uploads
      AI_WORKER_HOST: 0.0.0.0
      AI_WORKER_PORT: 8000
    volumes:
      - ./uploads:/shared/uploads
    networks:
      - eike_network
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.50"
          memory: 512M

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: eike_gateway_service
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres_db
      REDIS_HOST: redis_cache
      SHARED_UPLOAD: /shared/uploads
      DOCUMENT_SERVICE_URL: http://ai-worker:8000/api/v1/ai
      GATEWAY_SERVICE_PORT: 3000
    ports:
      - "${GATEWAY_SERVICE_PORT}:3000"
    volumes:
      - ./uploads:/shared/uploads
    networks:
      - public_network
      - eike_network
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      ai-worker:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
